name: windows-installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: msys2/setup-msys2@v2
        with:
          # UCRT64, not MINGW64: newer MSYS2 packages (nng among them) are
          # no longer built for the legacy msvcrt environment.  The package
          # set mirrors MSYS2's own mingw-w64-kicad PKGBUILD.
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-abseil-cpp
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-freeglut
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-glm
            mingw-w64-ucrt-x86_64-libgit2
            mingw-w64-ucrt-x86_64-ngspice
            mingw-w64-ucrt-x86_64-nng
            mingw-w64-ucrt-x86_64-opencascade
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-swig
            mingw-w64-ucrt-x86_64-wxwidgets3.2-msw
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-nsis

      - name: Require WebSocket-capable curl
        # The collaboration client talks WebSockets through libcurl; a build
        # against a curl without WS support connects to nothing, silently.
        run: curl-config --protocols | grep -qiE "^WSS?$" || { echo "MSYS2 curl lacks WebSocket support"; exit 1; }

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Configure
        # Library hints mirror MSYS2's own mingw-w64-kicad PKGBUILD.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_INSTALL_PREFIX=$PWD/stage
          -DCMAKE_PREFIX_PATH=/ucrt64
          -DwxWidgets_CONFIG_EXECUTABLE=/ucrt64/bin/wx-config-3.2
          -DOCC_INCLUDE_DIR=/ucrt64/include/opencascade
          -DOCC_LIBRARY_DIR=/ucrt64/lib
          -DNGSPICE_ROOT_DIR=/ucrt64
          -DPYTHON_EXECUTABLE=/ucrt64/bin/python.exe
          -DKICAD_SCRIPTING_WXPYTHON=OFF
          -DKICAD_BUILD_I18N=OFF
          -DKICAD_BUILD_QA_TESTS=OFF
          -DKICAD_UPDATE_CHECK=OFF
          -DKICAD_USE_PCH=ON
          -DKICAD_INSTALL_DEMOS=OFF

      - name: Build
        run: cmake --build build

      - name: Install to staging
        run: cmake --install build

      - name: Bundle runtime DLLs
        # Copy every MinGW DLL the shipped binaries load, so the installer
        # works on a machine without MSYS2.  Queue-based: each binary is
        # inspected exactly once (a rescan-everything loop blew the job
        # timeout on the slow runner ldd).
        run: |
          set -e
          cd stage/bin
          queue=$(ls *.exe *.dll *.kiface 2>/dev/null || true)
          seen=""
          while [ -n "$queue" ]; do
            next=""
            for f in $queue; do
              case " $seen " in *" $f "*) continue;; esac
              seen="$seen $f"
              for dep in $(ldd "$f" 2>/dev/null | awk '/\/ucrt64\//{print $3}'); do
                base=$(basename "$dep")
                if [ ! -f "$base" ]; then
                  cp "$dep" .
                  next="$next $base"
                fi
              done
            done
            queue=$next
          done
          ls *.dll | wc -l

      - name: Smoke test
        run: stage/bin/kicad-cli.exe version

      - name: Build installer
        run: |
          VERSION=$(tr -d '[:space:]' < packaging/VERSION)
          makensis -DVERSION="$VERSION" -DSTAGEDIR="$(cygpath -w $PWD/stage)" packaging/windows/installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: kicad-collaborative-windows-installer
          path: |
            packaging/windows/KiCad-Collaborative-*-windows-x64.exe
            KiCad-Collaborative-*-windows-x64.exe
          if-no-files-found: error
