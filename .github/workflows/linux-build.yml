name: linux-build

# Builds the Linux tarball.  Releases run it through release.yml, which also
# launch-tests the result and publishes it.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # Pinned: the tarball uses the build machine's library versions, and
    # ubuntu-latest moved to 26.04.  24.04 LTS is what most users run.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache pkg-config \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev libglew-dev libglm-dev libcairo2-dev libpixman-1-dev \
            libboost-all-dev libgit2-dev libngspice0-dev ngspice-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-data-exchange-dev libocct-visualization-dev \
            libocct-foundation-dev libocct-ocaf-dev \
            protobuf-compiler libprotobuf-dev libzstd-dev unixodbc-dev \
            libgtk-3-dev libsecret-1-dev libnng-dev libspnav-dev libpoppler-glib-dev python3 \
            libssl-dev zlib1g-dev gettext \
            glslang-tools spirv-tools libvulkan-dev libsqlite3-dev

      - name: Build WebSocket-capable curl
        # Ubuntu's curl predates enabled-by-default WebSockets, and the
        # collaboration client needs them; build and bundle our own.
        run: |
          CURL_VER=8.14.1
          curl -sSLO https://curl.se/download/curl-$CURL_VER.tar.gz
          tar xf curl-$CURL_VER.tar.gz
          cd curl-$CURL_VER
          ./configure --prefix=/opt/collab-curl --with-openssl --enable-websockets \
            --enable-versioned-symbols \
            --disable-manual --without-libpsl > /dev/null
          make -j$(nproc) > /dev/null
          sudo make install > /dev/null
          /opt/collab-curl/bin/curl-config --protocols | grep -qiE "^WSS?$"

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux2404-${{ github.sha }}
          restore-keys: ccache-linux2404-

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_INSTALL_PREFIX=/usr
          -DCURL_INCLUDE_DIR=/opt/collab-curl/include
          -DCURL_LIBRARY=/opt/collab-curl/lib/libcurl.so
          -DKICAD_BUILD_I18N=OFF
          -DKICAD_BUILD_QA_TESTS=OFF
          -DKICAD_UPDATE_CHECK=OFF
          -DKICAD_USE_PCH=ON
          -DKICAD_INSTALL_DEMOS=OFF

      - name: Build
        run: cmake --build build

      - name: Package tarball
        run: |
          VERSION=$(tr -d '[:space:]' < packaging/VERSION)
          DESTDIR=$PWD/pkgroot cmake --install build > /dev/null
          # Bundle the WebSocket curl beside the binaries; the launcher
          # prefers it via LD_LIBRARY_PATH.
          mkdir -p pkgroot/usr/lib/kicad-collab
          cp -a /opt/collab-curl/lib/libcurl.so* pkgroot/usr/lib/kicad-collab/
          cat > pkgroot/usr/bin/junction << 'EOF'
          #!/bin/sh
          # Runs Junction from wherever the tarball was extracted: KiCad's own
          # libraries and data are found beside this script, not under /usr.
          here=$(dirname "$(readlink -f "$0")")
          root=$(dirname "$here")
          export LD_LIBRARY_PATH="$root/lib/kicad-collab:$root/lib/x86_64-linux-gnu:$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export KICAD_STOCK_DATA_HOME="${KICAD_STOCK_DATA_HOME:-$root/share/kicad}"
          tool=kicad
          case "$1" in
            eeschema|pcbnew|gerbview|pl_editor|pcb_calculator|bitmap2component|kicad-cli) tool=$1; shift ;;
          esac
          exec "$here/$tool" "$@"
          EOF
          chmod +x pkgroot/usr/bin/junction
          # The Ubuntu packages that provide every library the binaries load,
          # so a user can install them in one apt command.
          mkdir -p pkgroot/usr/share/junction
          find pkgroot/usr -type f \( -perm -u+x -o -name '*.so*' -o -name '*.kiface' \) -exec sh -c 'file -b "$1" | grep -q ELF && echo "$1"' _ {} \; > elfs.txt
          export LD_LIBRARY_PATH="$PWD/pkgroot/usr/lib/kicad-collab:$PWD/pkgroot/usr/lib/x86_64-linux-gnu:$PWD/pkgroot/usr/lib"
          xargs -a elfs.txt ldd 2>/dev/null | awk '/=> \//{print $3}' | sort -u | grep -v "^$PWD/" > libs.txt
          # Merged /usr: dpkg may record a library under /lib or /usr/lib.
          while read -r lib; do
            alt=$(echo "$lib" | sed -e 's#^/usr/lib/#/lib/#;t' -e 's#^/lib/#/usr/lib/#')
            dpkg -S "$lib" 2>/dev/null || dpkg -S "$alt" 2>/dev/null || dpkg -S "$(readlink -f "$lib")" 2>/dev/null || echo "UNOWNED: $lib" >&2
          done < libs.txt | cut -d: -f1 | sort -u > pkgroot/usr/share/junction/ubuntu-packages.txt
          echo "Runtime packages:"; cat pkgroot/usr/share/junction/ubuntu-packages.txt
          if xargs -a elfs.txt ldd 2>/dev/null | grep "not found"; then echo "unresolved libraries"; exit 1; fi
          tar -C pkgroot -czf Junction-$VERSION-linux-x64.tar.gz usr
          ls -la Junction-$VERSION-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: junction-linux
          path: Junction-*-linux-x64.tar.gz
          if-no-files-found: error
