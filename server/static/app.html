<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KiCad Collaborative</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/dist/ui.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23001023'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23C83434'/%3E%3Ccircle cx='21' cy='21' r='4' fill='%234D7FC4'/%3E%3Cpath d='M11 11 L21 21' stroke='%23F2EDA1' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    /* KiCad's own palette is the only colour source: schematic paper for the
       workbench, the board canvas for stages, layer colours as accents. */
    --bench: #ECEBE6;      /* chrome: toolbars, sidebars, title bars */
    --paper: #F5F4EF;      /* surfaces (the schematic sheet) */
    --panel: #FFFFFF;      /* inputs, raised surfaces */
    --line: #CFCDC5;       /* 1px rules (Edge.Cuts grey) */
    --line-2: #B5B5B5;     /* grid dots */
    --ink: #1B1B1B;
    --ink-2: #5B5A55;
    --ink-3: #8C8B85;
    --copper: #C83434;     /* F.Cu — primary action */
    --copper-2: #A82B2B;
    --blue: #4D7FC4;       /* B.Cu — links, selection */
    --teal: #006464;       /* values & references */
    --wire: #009600;       /* live */
    --warn: #D19200;       /* ERC warning */
    --err: #E6090D;        /* ERC error */
    --silk: #F2EDA1;       /* silkscreen: labels on the canvas */
    --canvas: #001023;     /* board background */
    --shadow: 0 10px 30px #0003;
    --font: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    /* legacy aliases used by inline styles */
    --bg: var(--bench); --panel-2: var(--paper); --text: var(--ink); --muted: var(--ink-2);
    --accent: var(--blue); --hot: var(--warn); --ok: var(--wire); --danger: var(--err);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bench: #0C1522; --paper: #111D2C; --panel: #0A1421; --line: #24374E; --line-2: #2C425C;
      --ink: #E9E7E0; --ink-2: #ABB1BA; --ink-3: #7B838D;
      --copper: #DA4B4B; --copper-2: #C83434; --blue: #6F9EDD; --teal: #47B4B4; --wire: #3DBE3D;
      --warn: #E5A800; --err: #F0393D; --shadow: 0 10px 30px #000a;
    }
  }
  :root[data-theme="dark"] {
    --bench: #0C1522; --paper: #111D2C; --panel: #0A1421; --line: #24374E; --line-2: #2C425C;
    --ink: #E9E7E0; --ink-2: #ABB1BA; --ink-3: #7B838D;
    --copper: #DA4B4B; --copper-2: #C83434; --blue: #6F9EDD; --teal: #47B4B4; --wire: #3DBE3D;
    --warn: #E5A800; --err: #F0393D; --shadow: 0 10px 30px #000a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bench); color: var(--ink); font: 13px/1.45 var(--font); overflow: hidden;
         -webkit-font-smoothing: antialiased; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bench); }
  svg.glyph { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7;
              stroke-linecap: round; stroke-linejoin: round; flex: none; }

  #app { display: grid; grid-template-rows: 32px 1fr 24px; grid-template-columns: minmax(0, 1fr); height: 100%; }

  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px;
         color: var(--ink); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
         white-space: nowrap; }
  .btn:hover { border-color: var(--ink-3); text-decoration: none; }
  .btn.primary { background: var(--copper); border-color: var(--copper-2); color: #fff; }
  /* KiCad-style property dialogs (kicad-dialogs.js) */
  .kd-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; }
  .kd-dialog { background: var(--bench); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 18px 48px rgba(0,0,0,.35); min-width: 420px; max-width: min(760px, 94vw); max-height: 90vh; display: flex; flex-direction: column; font: 12px var(--font); }
  .kd-title { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); border-radius: 6px 6px 0 0; cursor: move; user-select: none; font-weight: 600; }
  .kd-title .kd-x { margin-left: auto; cursor: pointer; color: var(--ink-2); font-size: 15px; line-height: 1; padding: 0 4px; }
  .kd-title .kd-x:hover { color: var(--ink); }
  .kd-body { padding: 10px 14px; overflow: auto; }
  .kd-body h3 { margin: 10px 0 6px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  .kd-body h3:first-child { margin-top: 0; }
  .kd-body .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; align-items: center; }
  .kd-body .kv label { color: var(--ink-2); white-space: nowrap; }
  .kd-body input[type=text], .kd-body input[type=number], .kd-body select, .kd-body textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; color: var(--ink); font-family: var(--mono); width: 100%; box-sizing: border-box; }
  .kd-body .ro { color: var(--ink-2); font-family: var(--mono); }
  .kd-body .actions { display: flex; gap: 6px; grid-column: 1 / -1; }
  .kd-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  .kd-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 14px; border-top: 1px solid var(--line); }
  .kd-foot .spacer { flex: 1; }
  .kd-note { color: var(--ink-2); font-size: 11px; margin: 0 0 8px; }
  .btn.primary:hover { background: var(--copper-2); }
  .btn.danger { border-color: var(--err); color: var(--err); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }

  /* ---- views ---- */
  .view { display: none; min-height: 0; }
  .view.active { display: grid; }

  /* ---- home: a project-manager window ---- */
  #home { grid-template-columns: 220px 1fr; }
  #home nav { background: var(--bench); border-right: 1px solid var(--line); padding: 10px 8px;
              display: flex; flex-direction: column; gap: 1px; }
  #home nav button { text-align: left; background: none; border: 0; padding: 6px 10px; border-radius: 2px;
                     color: var(--ink); display: flex; align-items: center; gap: 9px; height: 28px; }
  #home nav button:hover { background: var(--paper); }
  #home nav button.active { background: var(--paper); box-shadow: inset 2px 0 0 var(--copper); }
  #home nav .sec { color: var(--ink-3); font: 500 10px var(--mono); text-transform: uppercase;
                   letter-spacing: .12em; padding: 16px 10px 5px; }
  #home main { overflow: auto; padding: 28px 36px 40px;
               background-color: var(--paper);
               background-image: radial-gradient(color-mix(in srgb, var(--line-2) 55%, transparent) 1px, transparent 1.3px);
               background-size: 20px 20px; }
  #home h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
  #home h2 { font: 500 11px/1 var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .12em;
             margin: 30px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .lead { color: var(--ink-2); margin: 0 0 16px; max-width: 64ch; font-size: 14px; }
  #home ol.lead { padding-left: 1.3em; } #home ol.lead li { margin: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
          cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .card:hover { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .card .thumb { aspect-ratio: 4 / 3; background: var(--canvas); display: grid; place-items: center;
                 overflow: hidden; position: relative; border-bottom: 1px solid var(--line); }
  .card .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 8px; opacity: 0; transition: opacity .25s; }
  .card .thumb img.ready { opacity: 1; }
  .card .thumb::before { content: ""; position: absolute; inset: 0;
                         background: linear-gradient(100deg, transparent 30%, #ffffff0a 50%, transparent 70%);
                         background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .card .thumb:has(img.ready)::before, .card .thumb:has(.ph)::before { display: none; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .card .thumb::before { animation: none; } }
  .card .thumb .ph { color: #2F4B6B; font-size: 30px; }
  .card .body { padding: 9px 11px 10px; }
  .card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { color: var(--ink-3); font: 11px var(--mono); display: flex; gap: 8px; margin-top: 3px; align-items: center; }
  .pill { display: inline-block; font: 500 10px/1.5 var(--mono); padding: 0 6px; border-radius: 2px;
          border: 1px solid var(--line); color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
  .pill.owner { border-color: var(--copper); color: var(--copper); }
  .pill.editor { border-color: var(--teal); color: var(--teal); }
  .empty { color: var(--ink-2); padding: 24px; border: 1px dashed var(--line); border-radius: 3px;
           text-align: center; background: var(--panel); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
               padding: 7px 10px; color: var(--ink); font: 12.5px var(--mono); }


  /* ---- editor: the page grid the React chrome (static/dist/ui.js) renders into.  The #ui-* hosts are
       display:contents wrappers, so the rendered #tbTop/#dockL/… are the grid's own children. ---- */
  #editor.active { display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: 1fr; }
  #ui-tbTop, #ui-tbAux, #ui-menubar, #ui-statusbar, #ui-dockL, #ui-dockR, #ui-tbLeft, #ui-tbRight { display: contents; }
  #editorBody { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; min-height: 0; min-width: 0; }
  #dockL { grid-column: 1; } #tbLeft { grid-column: 2; } #stage { grid-column: 3; } #tbRight { grid-column: 4; } #dockR { grid-column: 5; }
  #stage { position: relative; background: var(--canvas); overflow: hidden; touch-action: none; cursor: crosshair; min-width: 0; }
  #stage.pan { cursor: grab; } #stage.comment { cursor: cell; } #stage.zoomtool { cursor: zoom-in; } #stage.measure { cursor: crosshair; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #world { transform-origin: 0 0; position: absolute; left: 0; top: 0; pointer-events: none; }
  #world svg#base { display: block; width: 100%; height: auto; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #crosshair { position: absolute; inset: 0; pointer-events: none; display: none; }
  #crosshair.on { display: block; }
  #cmtPanel { position: absolute; display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 260px; max-width: 340px;
              box-shadow: var(--shadow); font-size: 12px; z-index: 5; }
  #cmtPanel .meta { color: var(--ink-3); font: 11px var(--mono); }
  #cmtPanel .cbody { margin: 2px 0 8px; white-space: pre-wrap; }
  #cmtPanel textarea { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 3px; color: var(--ink); padding: 6px; }
  #cmtPanel p { margin: 8px 0 0; display: flex; gap: 6px; }
  #signinOverlay { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; display: none; box-shadow: var(--shadow); }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 8px; align-items: center; }
  .kv label { color: var(--ink-2); }
  .kv input { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; color: var(--ink); font-family: var(--mono); width: 100%; }
  .kv .ro { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .muted { color: var(--ink-2); }
  .note { color: var(--ink-2); font-size: 12px; margin: 6px 0; }
  @media (max-width: 900px) { #home { grid-template-columns: 1fr; } #home nav { display: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="ui-menubar"></div>

  <!-- ===== Home: a project-manager window (rendered by the editor bundle, web/editor) ===== -->
  <section id="home" class="view">
    <nav>
      <button data-nav="recent" class="active"><svg class="glyph" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Recent projects</button>
      <button data-nav="explore"><svg class="glyph" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.6 2.6 14.4 0 17M12 3.5c-2.6 2.6-2.6 14.4 0 17"/></svg>Explore</button>
      <button data-nav="open"><svg class="glyph" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>Open a share link</button>
      <div class="sec">Desktop</div>
      <a class="btn" style="margin:0 2px" href="https://github.com/notaroomba/kicad-collaborative/releases" target="_blank">Get the app ↗</a>
    </nav>
    <main id="homeMain"></main>
  </section>

  <!-- ===== Editor: KiCad's frame.  Toolbars, docks, menus, status bar and overlays are React
       components in server/web (bundled into /static/dist/ui.js); only the stage is the editor bundle's (web/editor). ===== -->
  <section id="editor" class="view">
    <div id="ui-tbTop"></div>
    <div id="ui-tbAux"></div>
    <div id="editorBody">
      <div id="ui-dockL"></div>
      <div id="ui-tbLeft"></div>
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="world">
          <svg id="base" xmlns="http://www.w3.org/2000/svg"></svg>
          <svg id="overlay" xmlns="http://www.w3.org/2000/svg"><g id="ovRoot"><g id="peersG"></g><g id="selG"></g><g id="dragG"></g><g id="cmtG" style="pointer-events:auto"></g></g></svg>
        </div>
        <svg id="crosshair"><line id="chH" x1="0" x2="100%" stroke="var(--silk)" stroke-opacity=".6" stroke-width="1"/><line id="chV" y1="0" y2="100%" stroke="var(--silk)" stroke-opacity=".6" stroke-width="1"/></svg>
        <div id="cmtPanel"></div>
      </div>
      <div id="ui-tbRight"></div>
      <div id="ui-dockR"></div>
    </div>
  </section>

  <div id="ui-statusbar"></div>
</div>
<div id="ui-overlays"></div>
<script src="/static/kicad-canvas.js"></script>
<script src="/static/kicad-dialogs.js"></script>
<script src="/static/sch-tools.js"></script>
<script src="/static/pcb-tools.js"></script>
<script src="/static/props.js"></script>
<script src="/static/dist/editor.js"></script>
<script src="/static/dist/ui.js"></script>
</body>
</html>
