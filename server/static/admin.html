<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Junction</title>
<link rel="icon" type="image/svg+xml" href="/brand/j2/icon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/brand/j2/icon-192.png"><link rel="alternate icon" href="/brand/j2/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/brand/j2/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>try { var t = localStorage.getItem("kui.theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
{{THEME}}
  /* Everything above is static/theme.css.  Below is only this page's layout. */
  html, body { margin: 0; }
  body { min-height: 100vh; color: var(--ink); font: var(--fs-md)/1.5 var(--font); -webkit-font-smoothing: antialiased;
         background-color: var(--paper);
         background-image: radial-gradient(color-mix(in srgb, var(--line-2) 55%, transparent) 1px, transparent 1.3px);
         background-size: 20px 20px; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px var(--s-4); background: var(--bench);
           border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header .mark svg { width: 20px; height: 20px; display: block; }
  header b { font-weight: 600; }
  header .crumb { color: var(--ink-2); }
  header .sp { flex: 1; }
  header .stamp { font: var(--fs-xs) var(--mono); color: var(--ink-3); }
  main { max-width: 1120px; margin: 0 auto; padding: var(--s-5) var(--s-4) var(--s-7); display: grid; gap: var(--s-4); }
  h1 { margin: 0; font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.01em; }
  .top { display: flex; align-items: end; gap: var(--s-3); flex-wrap: wrap; }
  .top .sp { flex: 1; }
  .top p { margin: 2px 0 0; color: var(--ink-2); }
  .label { font: 500 var(--fs-2xs) var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .12em; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--s-3); }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3); padding: 12px 14px; display: grid; gap: 2px; }
  .tile .v { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: var(--fs-sm); color: var(--ink-2); }
  .tile .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 2px; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: var(--s-4); }
  .box > h2 { font-size: var(--fs-md); }
  .box > h2 .sp { flex: 1; }
  .box > h2 small { font: var(--fs-xs) var(--mono); color: var(--ink-3); font-weight: 400; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px var(--s-4); margin: 0 0 var(--s-3); }
  .facts div { display: grid; }
  .facts b { font-size: var(--fs-lg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .facts span { font-size: var(--fs-sm); color: var(--ink-2); }
  .facts:last-child { margin-bottom: 0; }

  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 150px; overflow: visible; }
  .chart .bar { fill: var(--ink-2); }
  .chart .bar.hot, .chart .dot { fill: var(--ink); }
  .chart .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .area { fill: color-mix(in srgb, var(--ink) 8%, transparent); }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .cross { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
  .chart .axis { display: flex; justify-content: space-between; font: var(--fs-xs) var(--mono); color: var(--ink-3); margin-top: 4px; }
  .chart .ymax { position: absolute; left: 0; top: -2px; font: var(--fs-xs) var(--mono); color: var(--ink-3); background: var(--panel); padding-right: 4px; }
  .chart .name { font-size: var(--fs-sm); color: var(--ink-2); margin: 0 0 6px; }
  .tip { position: fixed; z-index: 20; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-2);
         box-shadow: var(--shadow); padding: 5px 9px; font-size: var(--fs-sm); white-space: nowrap; display: none; }
  .tip b { font-variant-numeric: tabular-nums; }
  .tip span { color: var(--ink-3); font-family: var(--mono); font-size: var(--fs-xs); margin-right: 8px; }

  .split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 4px 0 6px; background: var(--panel); }
  .split i { display: block; height: 100%; }
  .split i:nth-child(1) { background: var(--ink); }
  .split i:nth-child(2) { background: var(--ink-3); }
  .split i:nth-child(3) { background: var(--line-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-sm); color: var(--ink-2); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }

  .rows { display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; font-size: var(--fs-base); }
  .row .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .n { font: var(--fs-sm) var(--mono); color: var(--ink-2); text-align: right; }
  .row .meter { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; }
  .row .meter i { display: block; height: 100%; background: var(--ink-2); border-radius: 2px; }

  table.people { width: 100%; border-collapse: collapse; font-size: var(--fs-base); }
  table.people th { text-align: left; font: 500 var(--fs-2xs) var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; padding: 0 0 6px; }
  table.people td { padding: 5px 0; border-top: 1px solid var(--line); vertical-align: middle; }
  table.people td.n, table.people th.n { text-align: right; font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-2); }
  table.people a { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  table.people a:hover { text-decoration: underline; }
  table.people img, table.people .ph { width: 20px; height: 20px; border-radius: 50%; background: var(--bench); border: 1px solid var(--line); }
  .empty { color: var(--ink-3); font-size: var(--fs-sm); }
  .note { color: var(--ink-3); font-size: var(--fs-sm); margin: var(--s-2) 0 0; }
  .state { padding: var(--s-6) 0; text-align: center; color: var(--ink-2); }
  @media (max-width: 600px) { main { padding: var(--s-3) 16px var(--s-6); } header .stamp { display: none; } }
</style>
</head>
<body>
<header>
  <a class="mark" href="/" title="Home">{{MARK}}</a>
  <b>Junction</b>
  <span class="crumb">Admin</span>
  <span class="sp"></span>
  <span class="stamp" id="stamp"></span>
  <button class="btn" type="button" id="refresh">Refresh</button>
</header>
<main id="app"><div class="state"><span class="spinner"></span> Loading statistics…</div></main>
<div class="tip" id="tip" role="tooltip"></div>
<script src="/static/dist/admin.js"></script>
</body>
</html>
