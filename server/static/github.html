<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub — KiCad Collaborative</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bench: #ECEBE6; --paper: #F5F4EF; --panel: #FFFFFF; --line: #CFCDC5; --line-2: #B5B5B5;
    --ink: #1B1B1B; --ink-2: #5B5A55; --ink-3: #8C8B85;
    --copper: #C83434; --copper-2: #A82B2B; --blue: #4D7FC4; --teal: #006464; --wire: #009600;
    --warn: #D19200; --err: #E6090D; --shadow: 0 10px 30px #0003;
    --font: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bench: #0C1522; --paper: #111D2C; --panel: #0A1421; --line: #24374E; --line-2: #2C425C;
      --ink: #E9E7E0; --ink-2: #ABB1BA; --ink-3: #7B838D;
      --copper: #DA4B4B; --copper-2: #C83434; --blue: #6F9EDD; --teal: #47B4B4; --wire: #3DBE3D;
      --warn: #E5A800; --err: #F0393D; --shadow: 0 10px 30px #000a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; color: var(--ink); font: 14.5px/1.5 var(--font); -webkit-font-smoothing: antialiased;
         background-color: var(--paper);
         background-image: radial-gradient(color-mix(in srgb, var(--line-2) 55%, transparent) 1px, transparent 1.3px);
         background-size: 20px 20px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--bench);
           border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header .mark svg { width: 20px; height: 20px; display: block; }
  header b { font-weight: 600; }
  header .crumb { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .sp { flex: 1; }
  header .who { font: 12px var(--mono); color: var(--ink-3); white-space: nowrap; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 16px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .box > h2 { margin: 0; padding: 8px 14px; font-size: 13px; font-weight: 600; background: var(--bench);
              border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .box > h2 .sp { flex: 1; }
  .box .in { padding: 14px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0 0 10px; } p:last-child { margin-bottom: 0; }
  .muted { color: var(--ink-2); font-size: 13px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 5px 14px;
         border-radius: 3px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
         font: 500 13.5px var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--ink-3); text-decoration: none; }
  .btn.primary { background: var(--copper); border-color: var(--copper-2); color: #fff; }
  .btn.primary:hover { background: var(--copper-2); }
  .btn.small { min-height: 28px; padding: 2px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.danger { color: var(--err); }
  input[type=text], select, textarea { width: 100%; min-height: 34px; padding: 5px 9px; border-radius: 3px; border: 1px solid var(--line);
         background: var(--paper); color: var(--ink); font: 13.5px var(--font); }
  select { width: auto; max-width: 100%; }
  label.f { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .row > .grow { flex: 1 1 200px; min-width: 0; }
  .list { border: 1px solid var(--line); border-radius: 3px; max-height: 300px; overflow: auto; background: var(--paper); }
  .list .it { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer;
              width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; font: inherit; }
  .list .it:last-child { border-bottom: 0; }
  .list .it:hover, .list .it.sel { background: color-mix(in srgb, var(--blue) 12%, transparent); }
  .list .it .nm { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .it .sp { flex: 1; }
  .list .empty { padding: 14px; color: var(--ink-2); font-size: 13px; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 2px; border: 1px solid var(--line); font: 11px/18px var(--mono);
         color: var(--ink-2); white-space: nowrap; }
  .tag.push { color: var(--blue); border-color: var(--blue); }
  .tag.pull { color: var(--teal); border-color: var(--teal); }
  .tag.conflict { color: var(--warn); border-color: var(--warn); }
  .tag.synced { color: var(--wire); border-color: color-mix(in srgb, var(--wire) 50%, var(--line)); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { flex: 1 1 110px; border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; background: var(--paper); }
  .chip b { display: block; font: 600 20px/1.2 var(--font); }
  .chip span { font-size: 12px; color: var(--ink-2); }
  .chip.push b { color: var(--blue); } .chip.pull b { color: var(--teal); } .chip.conflict b { color: var(--warn); } .chip.zero b { color: var(--ink-3); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3);
       padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--paper); }
  td { padding: 7px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.path { font: 12.5px var(--mono); overflow-wrap: anywhere; }
  td.detail { color: var(--ink-2); font-size: 12.5px; }
  tr.diffrow td { background: var(--paper); padding: 10px 14px; }
  .sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .side h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; }
  ul.changes { margin: 0; padding: 0; list-style: none; font-size: 12.5px; max-height: 260px; overflow: auto; }
  ul.changes li { padding: 2px 0; overflow-wrap: anywhere; }
  .k { display: inline-block; min-width: 58px; font: 11px var(--mono); }
  .k.added { color: var(--wire); } .k.removed { color: var(--err); } .k.changed { color: var(--blue); }
  td.act { white-space: nowrap; text-align: right; } td.act select { margin-right: 6px; }
  .note { border-left: 3px solid var(--blue); background: color-mix(in srgb, var(--blue) 8%, transparent); padding: 8px 12px; border-radius: 0 3px 3px 0; font-size: 13px; }
  .note.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .note.err { border-color: var(--err); background: color-mix(in srgb, var(--err) 8%, transparent); }
  .note.ok { border-color: var(--wire); background: color-mix(in srgb, var(--wire) 8%, transparent); }
  .note ul { margin: 4px 0 0; padding-left: 18px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--ink); padding: 5px 12px; font: 500 13px var(--font); cursor: pointer; min-height: 32px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--blue); color: #fff; }
  .commit { display: flex; gap: 10px; align-items: baseline; padding: 6px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .commit:last-child { border-bottom: 0; }
  .commit .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hide { display: none !important; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  @media (max-width: 600px) {
    main { padding: 12px 10px 50px; gap: 12px; }
    header .who { display: none; }
    /* The file table becomes a stack of cards: a row per file would not fit. */
    table.files thead { display: none; }
    table.files tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    table.files tr:last-child { border-bottom: 0; }
    table.files td { padding: 0; border: 0; }
    table.files td.path { grid-column: 1; }
    table.files td.st { grid-column: 2; grid-row: 1; text-align: right; }
    table.files td.detail { grid-column: 1 / -1; }
    table.files td.act { grid-column: 1 / -1; } table.files td.act:empty { display: none; }
    table.files td.act { display: flex; gap: 6px; margin-top: 4px; white-space: normal; } table.files td.act select { flex: 1; margin: 0; }
    table.files tr.diffrow { display: block; padding: 0; } table.files tr.diffrow td { display: block; padding: 10px 12px; }
    .btn { min-height: 40px; } input[type=text], select { min-height: 40px; font-size: 16px; }
    .actions .btn { flex: 1 1 auto; }
    .chip { flex: 1 1 40%; }
  }
</style>
</head>
<body>
<header>
  <a class="mark" href="/" title="Home">{{MARK}}</a>
  <b>GitHub</b>
  <span class="crumb" id="crumb"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <a class="btn small" id="back" href="/">Projects</a>
</header>
<main id="app"><div class="muted">Loading…</div></main>
<script src="/static/github.js"></script>
</body>
</html>
