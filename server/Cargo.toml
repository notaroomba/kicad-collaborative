[package]
name = "kicad-collab-server"
version = "0.1.0"
edition = "2021"

[dependencies]
kicad-collab-protocol = { path = "protocol" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rand = "0.8"
time = "0.3"
sha2 = "0.10"
sha1 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
tower-http = { version = "0.6", features = ["trace", "limit", "compression-gzip", "compression-br", "cors"] }
serde_urlencoded = "0.7"
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
