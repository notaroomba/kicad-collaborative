[package]
name = "kicad-collab-protocol"
version = "0.1.0"
edition = "2021"
description = "Wire-protocol types shared by the kicad-collab server and web clients (wasm-compatible)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }
